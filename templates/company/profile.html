{% extends 'base.html' %}
{% block title %}Company Profile | Smart Academia-Industry Portal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 space-y-6">
        <div class="pb-4 border-b border-slate-100">
            <h1 class="text-2xl font-black text-slate-900">Company Profile</h1>
            <p class="text-xs text-slate-500 mt-1">Manage your enterprise identity, headquarters, and web presence</p>
        </div>

        <form action="{{ url_for('company.profile') }}" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Company Name</label>
                <input type="text" name="company_name" value="{{ company.company_name }}" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Industry Sector</label>
                    <input type="text" name="industry_type" value="{{ company.industry_type }}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Headquarters Location</label>
                    <input type="text" name="location" value="{{ company.location }}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Official Website URL</label>
                <input type="url" name="website" value="{{ company.website or '' }}" placeholder="https://..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Company Overview</label>
                <textarea name="description" rows="4" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">{{ company.description or '' }}</textarea>
            </div>

            <div class="pt-2 flex justify-end">
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md shadow-blue-200 transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
